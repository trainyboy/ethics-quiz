<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:,">
<title>Computer Ethics Study Deck</title>
<style>
:root{
  --bg:#f5f6fb; --panel:#ffffff; --text:#1c1f2e; --muted:#6b7084; --line:#e3e5ef;
  --accent:#4f46e5; --accent-2:#6366f1; --accent-soft:#eef0ff;
  --good:#12a150; --good-soft:#e3f6ea; --bad:#e5484d; --bad-soft:#fdeaea;
  --star:#f5a524; --radius:16px; --shadow:0 1px 2px rgba(20,22,40,.06),0 8px 24px rgba(20,22,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1117; --panel:#181b25; --text:#e8eaf3; --muted:#9aa0b6; --line:#2a2f3e;
    --accent:#818cf8; --accent-2:#6366f1; --accent-soft:#232848; --good:#3ecf7a; --good-soft:#15301f;
    --bad:#ff6b6f; --bad-soft:#3a1b1d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);
  line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:1.15rem;letter-spacing:-.01em;min-width:0}
.logo{flex:none;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#a855f7);display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:var(--shadow)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.spacer{flex:1}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px}
.tab{flex:1;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.select,.btn,.input{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px}
.btn{font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.count{color:var(--muted);font-size:.9rem}
.panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.b-num{background:var(--accent-soft);color:var(--accent)}
.b-type{background:var(--line);color:var(--muted)}
.b-edit{background:var(--good-soft);color:var(--good)}
.b-missed{background:var(--bad-soft);color:var(--bad)}
.b-again{background:var(--bad-soft);color:var(--bad)}
.star{border:0;background:transparent;font-size:1.35rem;line-height:1;color:var(--muted);padding:4px}
.star.on{color:var(--star)}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qtext{font-size:1.15rem;font-weight:620;letter-spacing:-.005em}
.letter{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:750;font-size:.85rem;background:var(--accent-soft);color:var(--accent)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress > i{display:block;height:100%;background:var(--good)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.done-count{font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.correct .letter{background:var(--good);color:#fff}
.opt.wrong .letter{background:var(--bad);color:#fff}
.opt.missedopt{border-style:dashed}
.opt.missedopt::after{content:'missed';margin-left:auto;font-size:.72rem;font-weight:700;color:var(--good);text-transform:uppercase;align-self:center}
.opt[disabled]{cursor:default}
.opts.tf{flex-direction:row}
.opts.tf .opt{justify-content:center;font-weight:700;font-size:1.05rem;padding:16px}
.feedback{border-radius:12px;padding:10px 14px;margin-top:4px;display:flex;flex-direction:column;gap:4px}
.feedback.good{background:var(--good-soft);border:1px solid var(--good)}
.feedback.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.feedback.good strong.t{color:var(--good)} .feedback.bad strong.t{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{justify-content:flex-end}
.result-hero{text-align:center;padding:10px 0 18px}
.result-hero .big{font-size:3rem;font-weight:800;letter-spacing:-.03em}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel)}
.item .q{font-weight:600}
.item .a{color:var(--good);font-weight:600;margin-top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:12px;padding:12px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:1.5rem}
.stat span{color:var(--muted);font-size:.8rem}
.overlay{position:fixed;inset:0;background:rgba(10,12,25,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.overlay.show{display:flex}
@media (min-width:640px){.overlay{align-items:center}}
.modal{background:var(--panel);border-radius:20px;max-width:560px;width:100%;padding:20px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
.checkrow input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:90vw;bottom:24px;background:var(--text);color:var(--panel);padding:10px 16px;border-radius:12px;display:none;z-index:60;font-weight:600}
.toast.show{display:block}
.search{flex:1;min-width:180px}
.sync-btn .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync-btn[data-status="synced"] .dot{background:var(--good)}
.sync-btn[data-status="syncing"] .dot{background:var(--accent)}
.sync-btn[data-status="offline"] .dot{background:var(--star)}
.sync-btn[data-status="error"] .dot{background:var(--bad)}
.sync-btn[data-status="error"]{border-color:var(--bad)}
.sync-note{font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.sync-status{font-size:.85rem;margin:8px 0 0}
.choice-box{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.fill-input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);font-size:1.05rem}
.fill-input:focus{outline:none;border-color:var(--accent)}
.fill-input.correct{border-color:var(--good);background:var(--good-soft)}
.fill-input.wrong{border-color:var(--bad);background:var(--bad-soft)}
kbd{font-family:inherit;font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--panel)}
.kbd{font-size:.78rem;color:var(--muted);text-align:center;margin-top:10px}
@media (max-width:560px){
  .wrap{padding:12px 12px 28px}
  .qtext{font-size:1.05rem}
  .hide-sm{display:none}
  .opts.tf{flex-direction:column}
  header.top{gap:8px}
  .sync-btn #syncLabel{display:none}
  .sync-btn{padding:9px 10px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">⚖︎</div><div>Computer Ethics<small id="subtitle">Study deck</small></div></div>
    <div class="spacer"></div>
    <button class="btn small sync-btn" id="syncBtn" hidden title="Cross-device sync"><span class="dot"></span><span id="syncLabel">Sync</span></button>
    <button class="btn small" id="exportBtn" title="Download deck as CSV (includes your edited answers)">⬇ <span class="hide-sm">Export</span> CSV</button>
    <button class="btn small ghost" id="resetBtn" title="Reset progress">↺ <span class="hide-sm">Reset</span></button>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="study">Study</button>
    <button class="tab" role="tab" data-tab="browse">Browse &amp; edit</button>
  </nav>
  <div class="toolbar">
    <label class="muted" for="filterSel" style="font-size:.9rem">Cards:</label>
    <select class="select" id="filterSel">
      <option value="all">All cards</option>
      <option value="starred_missed">Starred / Missed</option>
      <option value="starred">Starred only</option>
      <option value="missed">Missed only</option>
    </select>
    <span class="count" id="filterCount"></span>
  </div>
  <main id="view"></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script id="deck-data" type="application/json">[{"n": 1, "q": "In the video \"Digital Ethics and the Future of Humans in a Connected World\" by Gerd Leonhard, which of the following statements is the most correct?", "c": ["People work less because they are distracted by social media and mobile devices.", "Stephen Hawking states Artificial Intelligence is not our last and greatest invention.", "Technology has no ethics.", "Facebook has 100s of people creating the content for its news feed."], "a": "C", "at": "Technology has no ethics.", "type": "single"}, {"n": 2, "q": "In the video regarding the paper \"What is Computer Ethics\" by James Moore, which statement below is the most accurate?", "c": ["Computer ethics is about right and wrong behavior as defined by a person's religion.", "Computer ethics is about the social impact of computer technology and the ethical use of such technology.", "Computer ethics is about computer security.", "Computer ethics is about right and wrong behavior as defined by local laws."], "a": "B", "at": "Computer ethics is about the social impact of computer technology and the ethical use of such technology.", "type": "single"}, {"n": 3, "q": "In the video regarding the paper \"What is Computer Ethics\" by James Moore, which statement below is the most accurate?", "c": ["Computer technology has transformed our definition of traditional work as \"work\" is no longer something that happens at a specific time or specific place.", "Computer technology has made money more accessible, but has not redefined what money is.", "Executives that work from home gain spontaneous interaction with colleagues because of handheld devices.", "Computer technology is rigid, fixed, and not mealleable, which leads to abuse of the user."], "a": "A", "at": "Computer technology has transformed our definition of traditional work as \"work\" is no longer something that happens at a specific time or specific place.", "type": "single"}, {"n": 4, "q": "In the video regarding the paper \"Computer Ethics: Basic Concepts and Historical Overview\" by Terrell Ward Bynum, which statement below is the most accurate?", "c": ["The field of Computer Ethics began after the first recorded network intrusion at the Flagger Dog Track in the state of Floida (USA).", "The field of Computer Ethics is partially a response to the development of an antiaircraft cannon capable of shooting down fast warplanes.", "Unlinke the Industrial Revolution, computer technology is not transforming society.", "Computer technology has made money more accessible, but has not redefined what money is."], "a": "B", "at": "The field of Computer Ethics is partially a response to the development of an antiaircraft cannon capable of shooting down fast warplanes.", "type": "single"}, {"n": 5, "q": "In the video regarding the paper \"Computer Ethics: Basic Concepts and Historical Overview\" by Terrell Ward Bynum, which statement below is the most accurate?", "c": ["In the long run, computer technology will eliminate more jobs than it creates.", "According to US law, it not is possible for a person to own a patent on a computer algorithm and prevent others from using it.", "Although it is possible to own the source code, object code (machine language), and algorithm assosciated with a computer program, it is not possible to own the \"look and feel\" of a program.", "Computer technology may cause \"de-skilling\" by replacing human skill with computer technology."], "a": "D", "at": "Computer technology may cause \"de-skilling\" by replacing human skill with computer technology.", "type": "single"}, {"n": 6, "q": "In the video \"Ethics in the Age of Technology\" by Juan Enriquez, which of the following statements is the most correct?", "c": ["Doctor J. Marion Sims is regarded as one of the first Doctors to suggest slavery is unethical and should be abolished.", "Defining who teaches us ethics is difficult because sometimes our traditional sources of guidance like holy books, parents, religious leaders, teachers, lawyers, doctors, and the government provide incorrect information.", "Lawyer Thomas Cooper, in his \"1826 pamphlets,\" is regarded as one the first Lawyers to suggest slavery is unethical.", "Baptist Pastor Richard Furman is regarded as one of the first religious leaders to speak out about the abolishment of slavery."], "a": "B", "at": "Defining who teaches us ethics is difficult because sometimes our traditional sources of guidance like holy books, parents, religious leaders, teachers, lawyers, doctors, and the government provide incorrect information.", "type": "single"}, {"n": 7, "q": "In the video regarding the paper \"Interaction Between Ethics and Technology\" by Shakib and Layton, which statement below is the most correct?", "c": ["Although there is universal agreement regarding what actions are right and wrong, engaging in correct action is still difficult.", "Consumers are having an impact on businesses by supporting those businesses that they believe are morally sound, and thereby making it more difficult for an unethical business to survive.", "Consumers are not affecting businesses because ethical and non-ethical businesses are supported in equal amounts.", "An action is utilitarian if it benefits the least number of people."], "a": "B", "at": "Consumers are having an impact on businesses by supporting those businesses that they believe are morally sound, and thereby making it more difficult for an unethical business to survive.", "type": "single"}, {"n": 8, "q": "In the video regarding the paper \"Interaction Between Ethics and Technology\" by Shakib and Layton, which statement below is the most accurate?", "c": ["There is no universal ethics.", "Walter Maner argues that computer technology does not create novel, ethical issues.", "Because we can test software and prove it is error free, we should spend more time on sofwtare testing.", "There is no need for Computer Ethics education as an understanding of ethics is universal."], "a": "A", "at": "There is no universal ethics.", "type": "single"}, {"n": 9, "q": "In the video regarding the paper \"Multimedia, Cyberspace, and Ethics\" by Jefferies, which statement below is the most accurate?", "c": ["It is not easy to regulate the Internet because it is a global network without any boundaries.", "Computer technology enhances our privacy.", "Cameras used to support surveillance in public locations are not considered to violate a person's privacy because no one expects privacy in a public space.", "The new generation that is born into a culture that uses the Internet (unlike the older generation that has not always had the Internet) is aware of the privacy they are giving up by using this public domain."], "a": "A", "at": "It is not easy to regulate the Internet because it is a global network without any boundaries.", "type": "single"}, {"n": 10, "q": "In the video regarding the paper \"Multimedia, Cyberspace, and Ethics\" by Jefferies, which statement below is the most accurate?", "c": ["Deep Fake technology creates an ethical issue by allowing a victim's appearance to be faked in a video, appearing to be doing whatever the Deep Fake developer wants.", "Bill Gates stated he felt a personal responsibility to build an Internet that is ethical.", "Deep Fake technology allows one to fake one's fingerprints and frame someone for a crime they did not commit.", "The Internet is a major contribution to cultural diversity."], "a": "A", "at": "Deep Fake technology creates an ethical issue by allowing a victim's appearance to be faked in a video, appearing to be doing whatever the Deep Fake developer wants.", "type": "single"}, {"n": 11, "q": "In the video \"The Social Dilemma of Driverless Cars\" by Iyad Rahwan, what was the suggestion provided by a blogger?", "c": ["Cars should be equipped with a \"people catcher\" (like a \"cow catcher\" on the front of trains) that push people gently out of the way when the driver loses control of the car.", "The driver of the car should push an eject button just before impact to avoid being killed in a car accident.", "Cars should be made out of soft spongy material (the \"Nurf car\") to help reduce deaths in the case of accidents.", "All drivers should wear helmets and other safety gear to help them survive what would normally be a deadly crash."], "a": "B", "at": "The driver of the car should push an eject button just before impact to avoid being killed in a car accident.", "type": "single"}, {"n": 12, "q": "In the video regarding the paper \"The Ethics of Driverless Cars\" by Neil McBride, what is meant by an \"iron cage\"?", "c": ["The \"iron cage\" is another name for a driverless car in that it is made of iron, but has no one in it.", "The \"iron cage\" is technology that has constrained us.", "The \"iron cage\" is the place people should be to keep them safe from driverless cars.", "The \"iron cage\" is a modification to the car that makes it safe."], "a": "B", "at": "The \"iron cage\" is technology that has constrained us.", "type": "single"}, {"n": 13, "q": "In the video regarding the paper \"The Ethics of Driverless Cars\" by Neil McBride, what is suggested in the conclusion?", "c": ["We need to perfect the technology regarding driverless cars so less people are injured.", "Driverless cars allow the passenger to have more free time to pursue other activities.", "Driverless cars are essential for allowing the human spirit to be free.", "We need a car that provides more information to the user so the user can be a better driver."], "a": "D", "at": "We need a car that provides more information to the user so the user can be a better driver.", "type": "single"}, {"n": 14, "q": "In the video regarding the paper \"Automated Detect and Avoid\" by Erik Theunissen and others, which of the following statements is the most correct?", "c": ["An ethical issue arises because writing code involves a degree of premeditation regarding how a robot car will act.", "Algorithm developers and programmers are forgiven for accidents because everyone knows computer code is imperfect.", "We should code human behavior because human situations are simple and easy to program.", "When a human acts without deliberation, they are ethically responsible to the same degree as a programmer making premeditated decisions for a robot car."], "a": "A", "at": "An ethical issue arises because writing code involves a degree of premeditation regarding how a robot car will act.", "type": "single"}, {"n": 15, "q": "In the video regarding the paper \"Automated Detect and Avoid\" by Erik Theunissen and others, which of the following statements is the most correct?", "c": ["When it comes to programming automated detect and avoid algorithms, it is best to replace all human judgment with algorithms as algorithms can be perfected to respond correctly in all situations.", "When it comes to programming automated detect and avoid algorithms, human values and judgments do not become part of the code.", "Current data does not support the claim that self-driving cars have resulted in a reduction in the number of accidents.", "Current data supports the claim that self-driving cars have resulted in a reduction in the number of accidents."], "a": "C", "at": "Current data does not support the claim that self-driving cars have resulted in a reduction in the number of accidents.", "type": "single"}, {"n": 16, "q": "According to Juan Enriquez in his book \"Right Wrong: How Technology Transforms our Ethics\" (see the PowerPoint slides provided with the course material), ethics does not change over time.", "c": ["True", "False", "", ""], "a": "B", "at": "False", "type": "tf"}, {"n": 17, "q": "According to Juan Enriquez in his book \"Right Wrong: How Technology Transforms our Ethics\" (see the PowerPoint slides provided with the course material), ethics changes our technology.", "c": ["True", "False", "", ""], "a": "B", "at": "False", "type": "tf"}, {"n": 18, "q": "According to Juan Enriquez in his book \"Right Wrong: How Technology Transforms our Ethics\" (see the PowerPoint slides provided with the course material), it pays to be humble about the past, as we too will be judged by the future.", "c": ["True", "False", "", ""], "a": "A", "at": "True", "type": "tf"}, {"n": 19, "q": "According to the video regarding \"Computer Technology is Like the Gift of Fire,\" computer technology is like fire in that if it is not managed appropriately, it can get out of control and hurt many people.", "c": ["True", "False", "", ""], "a": "A", "at": "True", "type": "tf"}, {"n": 20, "q": "According to the course Syllabus, students are expected to be quiet and not participate in discussions during class.", "c": ["True", "False", "", ""], "a": "B", "at": "False", "type": "tf"}, {"n": 21, "q": "In the video regarding \"Woman Injured by a Garage Door,\" which direction is the garage door closing?", "c": ["The garage door closes from the top down.", "The garage door closes from left and right at the same time.", "The garage door closes from left to right.", "The garage door closes from right to left."], "a": "C", "at": "The garage door closes from left to right.", "type": "single"}, {"n": 22, "q": "In the video regarding the paper \"Ethics and Safety of Computer Systems,\" which of the following statements is the most correct?", "c": ["The main issue is regarding the proper use of critical systems by the non-computer scientist.", "The main issue is regarding the responsibility for computer failures in critical systems.", "Because the 'Computer Medical Assistant' is error free, medical personnel are unethical if they do not follow the suggestion provided by this service.", "Proving computer systems are correct is easy and therefore we should always prove them correct before allowing the public to use them."], "a": "B", "at": "The main issue is regarding the responsibility for computer failures in critical systems.", "type": "single"}, {"n": 23, "q": "In the video regard  cyber warfare.", "The Just War Theory states cyber warfare is unethical."], "a": "C", "at": "The Just War Theory is inadequate for evaluating the ethicalness of cyber warfare.", "type": "single"}, {"n": 87, "q": "Regarding the video about the paper \"An Analysis of a Just Cyber Warfare,\" which of the following statements in the most accurate?", "c": ["Cyber Warfare makes the Just War Theory invalid.", "When addressing Cyber Warfare, the Just War Theory cannot be applied and should be rejected altogether.", "A principle of Just Cyber Warfare is that a Cyber War should be waged to promote the well-being of the infosphere.", "Floridi states 'information has a right to exist,' and therefore cyber warfare that destroys information is unethical."], "a": "D", "at": "Floridi states 'information has a right to exist,' and therefore cyber warfare that destroys information is unethical.", "type": "single"}, {"n": 88, "q": "According to the paper regarding \"Ethic in Massively Multiplayer Online Role-Playing Games,\" what are the primary means by which playing games help guide moral development? Select all that apply.", "c": ["Practice following rules.", "Defining good and bad behavior.", "Learning a system of rules.", "Developing poor social skills"], "a": "A,B,C", "at": "Practice following rules.\nDefining good and bad behavior.\nLearning a system of rules.", "type": "multi"}, {"n": 89, "q": "An investigation done by Coyne (as cited in Ethic in Massively Multiplayer Online Role-Playing Games) finds that online griefing has a similar impact as traditional bullying.", "c": ["True", "False", "", ""], "a": "A", "at": "True", "type": "tf"}, {"n": 90, "q": "Griefing is bulling; it is abusive; it evokes real emotion; it is genuinely hurtful.", "c": ["True", "False", "", ""], "a": "A", "at": "True", "type": "tf"}, {"n": 91, "q": "There should be more public outcry regarding the unethical mapping of the Internet with the Carna botnet.", "c": ["True", "False", "", ""], "a": "A", "at": "True", "type": "tf"}, {"n": 92, "q": "It is not unethical to use default passwords to enter a computer network that one is not authorized to enter.", "c": ["True", "False", "", ""], "a": "B", "at": "False", "type": "tf"}, {"n": 93, "q": "What are the main elements of a 'Just War Theory?'", "c": ["War as a last resort", "To the victor goes the spoils (goods taken by force).", "Do more good than harm.", "Avoid harming non-combatants"], "a": "A,C,D", "at": "A) War as a last resort\nC) Do more good than harm.\nD) Avoid harming non-combatants", "type": "multi"}]</script>
<script>
/* ======================= CROSS-DEVICE SYNC CONFIG =======================
   Paste your Supabase project URL and anon / publishable key here.
   Leave the placeholders as they are to run local-only (no sync UI).     */
const SUPABASE_URL      = 'https://jbbimrvqolmgxpxbgxqb.supabase.co';       // e.g. 'https://abcdefghijklmnop.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_icjF5LCzbbn7e0z6h93NrA_mYf-68Mv';  // legacy anon JWT (eyJ...) or sb_publishable_...
/* ======================================================================== */
(function(){
'use strict';
const DECK = JSON.parse(document.getElementById('deck-data').textContent);
const L = ['A','B','C','D'];
const KEY = 'ethicsQuiz.v1';
const REQUEUE_GAP = 3;          // a missed question comes back after this many other questions
const byN = {}; DECK.forEach(c => byN[c.n] = c);

// ---------- state ----------
function fresh(){ return {v:1, updatedAt:0, tab:'study', filter:'all', stars:{}, missed:{}, edits:{}, stats:{}, study:null}; }
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 1){ const f = fresh(); Object.keys(f).forEach(k => { if (k in s) f[k] = s[k]; }); if (f.tab !== 'browse') f.tab = 'study'; return f; }
  } catch(e){}
  return fresh();
}
let S = load();
// persist(): write the local cache only (no "real" change, e.g. tab switch or auto-started round).
// touch():   a user change (answer, star, edit, restart, reset, filter); bumps updatedAt and schedules a sync push.
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function touch(){ S.updatedAt = Date.now(); persist(); Sync.schedule(); }

// ---------- helpers ----------
const $ = s => document.querySelector(s);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function isEdited(c){ return Object.prototype.hasOwnProperty.call(S.edits, c.n); }
function ans(c){ return isEdited(c) ? S.edits[c.n] : c.a; }
function isFill(c){ return c.type === 'fill'; }
function isTF(c){ return c.type === 'tf'; }
function optIdx(c){ const r = []; c.c.forEach((t, i) => { if (String(t).trim() !== '') r.push(i); }); return r; }
function ansSet(c){ return ans(c).split(',').map(s => s.trim().toUpperCase()).filter(Boolean); }
function isMulti(c){ return !isFill(c) && (/select all/i.test(c.q) || ansSet(c).length > 1); }
function answerText(c){
  if (isFill(c)) return ans(c);
  return ansSet(c).map(l => { const i = L.indexOf(l); return l + '. ' + (i >= 0 ? c.c[i] : '?'); }).join('\n');
}
function typeLabel(c){ return isFill(c) ? 'Type answer' : isTF(c) ? 'True/False' : isMulti(c) ? 'Select all' : 'Multiple choice'; }
function badges(c, opts){
  opts = opts || {};
  let h = '<span class="badge b-num">#' + c.n + '</span><span class="badge b-type">' + typeLabel(c) + '</span>';
  if (isEdited(c)) h += '<span class="badge b-edit" title="You edited this answer">✎ edited</span>';
  if (opts.missed && S.missed[c.n]) h += '<span class="badge b-missed">missed</span>';
  if (opts.again) h += '<span class="badge b-again" title="You missed this one earlier this round">↻ again</span>';
  return h;
}
function filtered(){
  const f = S.filter;
  return DECK.filter(c => f === 'all' || (f === 'starred' && S.stars[c.n]) || (f === 'missed' && S.missed[c.n]) ||
    (f === 'starred_missed' && (S.stars[c.n] || S.missed[c.n])));
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800); }
function norm(s){ return String(s).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function checkFill(c, input){
  const a = norm(ans(c)), u = norm(input);
  if (!u) return false;
  if (u === a) return true;
  const qWords = new Set(norm(c.q).split(' '));
  const keyWords = a.split(' ').filter(w => w.length >= 4 && !qWords.has(w));
  const uw = new Set(u.split(' '));
  return keyWords.length > 0 && keyWords.every(w => uw.has(w) || [...uw].some(x => x.length >= 5 && (w.startsWith(x) || x.startsWith(w))));
}
function sameSet(a, b){ return [...a].sort().join(',') === [...b].sort().join(','); }
function toggleStar(n){ if (S.stars[n]) delete S.stars[n]; else S.stars[n] = true; touch(); updateCount(); }

// ---------- top-level ----------
function setTab(t){ S.tab = t; persist(); render(); }
function updateCount(){
  $('#filterCount').textContent = filtered().length + ' of ' + DECK.length + ' cards';
  $('#subtitle').textContent = DECK.length + ' cards · ' + Object.keys(S.stars).length + ' starred · ' + Object.keys(S.missed).length + ' missed';
}
function render(){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  $('#filterSel').value = S.filter;
  updateCount();
  const v = $('#view'); v.innerHTML = '';
  (S.tab === 'browse' ? renderBrowse : renderStudy)(v);
}

// ---------- question widget ----------
// Renders one question into el. Calls onAnswer(correct, {override}) when answered.
function questionWidget(el, c, opts, onAnswer){
  const multi = isMulti(c), tf = isTF(c), fill = isFill(c);
  const sel = new Set(); let answered = false;
  let html = '<div class="meta">' + badges(c, {again: opts.again}) + '<span class="spacer"></span><button class="star' + (S.stars[c.n] ? ' on' : '') + '" data-w="star" title="Star">' + (S.stars[c.n] ? '★' : '☆') + '</button></div>' +
    '<div class="qtext" style="margin-top:10px">' + esc(c.q) + '</div>';
  if (multi) html += '<div class="muted" style="font-size:.85rem;margin-top:6px">Select all that apply, then press Check.</div>';
  if (fill){
    html += '<div style="margin:16px 0"><input class="fill-input" id="fillIn" placeholder="Type your answer…" autocomplete="off"></div>' +
      '<div class="row"><button class="btn primary" data-w="check">Check</button><button class="btn ghost" data-w="dontknow">I don\'t know</button></div>';
  } else {
    html += '<div class="opts' + (tf ? ' tf' : '') + '">' + optIdx(c).map(i =>
      '<button class="opt" data-letter="' + L[i] + '">' + (tf ? '' : '<span class="letter">' + L[i] + '</span>') + '<span>' + esc(c.c[i]) + '</span></button>').join('') + '</div>';
    if (multi) html += '<div class="row"><button class="btn primary" data-w="check" disabled>Check</button></div>';
  }
  html += '<div id="fb"></div>';
  el.innerHTML = html;
  const fb = el.querySelector('#fb');
  el.querySelector('[data-w="star"]').addEventListener('click', e => { const b = e.currentTarget; toggleStar(c.n); b.classList.toggle('on', !!S.stars[c.n]); b.textContent = S.stars[c.n] ? '★' : '☆'; });
  function finish(correct, typed){
    answered = true;
    const set = ansSet(c);
    el.querySelectorAll('.opt').forEach(b => { b.disabled = true; const l = b.dataset.letter; b.classList.remove('sel');
      if (set.includes(l)){ b.classList.add('correct'); if (multi && !sel.has(l)) b.classList.add('missedopt'); } else if (sel.has(l)) b.classList.add('wrong'); });
    el.querySelectorAll('[data-w="check"],[data-w="dontknow"]').forEach(b => b.disabled = true);
    const fi = el.querySelector('#fillIn'); if (fi){ fi.disabled = true; fi.classList.add(correct ? 'correct' : 'wrong'); }
    const showAns = !correct && (fill || multi);
    fb.innerHTML = '<div class="feedback ' + (correct ? 'good' : 'bad') + '" id="feedback" data-correct="' + correct + '">' +
      '<div class="row"><strong class="t">' + (correct ? '✓ Correct' : '✗ Wrong') + '</strong><span class="spacer"></span>' +
      (fill && !correct && typed ? '<button class="btn small" data-w="override">I was right</button>' : '') +
      '<button class="btn small ghost" data-w="edit">✎ Edit key</button></div>' +
      (showAns ? '<div><b>Answer:</b> ' + esc(answerText(c)).replace(/\n/g, '<br>') + '</div>' : '') + '</div>';
    fb.querySelector('[data-w="edit"]').addEventListener('click', () => openEdit(c, () => {
      const n = fb.querySelector('#keyNote') || fb.querySelector('#feedback').appendChild(Object.assign(document.createElement('div'), {id:'keyNote', className:'muted'}));
      n.textContent = 'Answer key now: ' + ans(c) + ' (applies from the next attempt).';
    }));
    const ov = fb.querySelector('[data-w="override"]');
    if (ov) ov.addEventListener('click', () => {
      ov.remove(); const f = fb.querySelector('#feedback'); f.className = 'feedback good'; f.dataset.correct = 'true';
      f.querySelector('.t').textContent = '✓ Counted as correct'; if (fi){ fi.classList.remove('wrong'); fi.classList.add('correct'); }
      onAnswer(true, {override:true});
    });
    onAnswer(correct, {});
  }
  el.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    if (answered) return;
    const l = b.dataset.letter;
    if (multi){ if (sel.has(l)) sel.delete(l); else sel.add(l); b.classList.toggle('sel', sel.has(l)); el.querySelector('[data-w="check"]').disabled = sel.size === 0; }
    else { sel.add(l); finish(sameSet(sel, ansSet(c))); }
  }));
  const chk = el.querySelector('[data-w="check"]');
  if (chk) chk.addEventListener('click', () => {
    if (answered) return;
    if (fill){ const fi = el.querySelector('#fillIn'), val = fi.value; if (!val.trim()){ fi.focus(); return; } finish(checkFill(c, val), val); }
    else finish(sameSet(sel, ansSet(c)));
  });
  const dk = el.querySelector('[data-w="dontknow"]'); if (dk) dk.addEventListener('click', () => { if (!answered) finish(false, ''); });
  const fi = el.querySelector('#fillIn');
  if (fi){ fi.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); chk.click(); } }); setTimeout(() => fi.focus(), 30); }
  return {
    key(k){
      if (answered || fill) return false;
      const m = {'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3}[k.toLowerCase()];
      if (m !== undefined){ const b = el.querySelector('.opt[data-letter="' + L[m] + '"]'); if (b){ b.click(); return true; } }
      if (k === 'Enter' && multi && chk && !chk.disabled){ chk.click(); return true; }
      return false;
    },
    get answered(){ return answered; }
  };
}

// ---------- study round ----------
// queue[0] is the current question. Correct → retired (never returns this round).
// Wrong → re-inserted REQUEUE_GAP positions later.
let widget = null;
function startRound(ids){
  S.study = {queue: shuffle(ids), total: ids.length, done: [], wrongOnce: [], attempts: 0, wrong: 0, current: null};
  persist();
}
function renderStudy(v){
  if (Sync.initialPending){ v.innerHTML = '<div class="panel empty" id="syncLoading">Loading your synced progress…</div>'; return; }
  if (!S.study){
    const list = filtered();
    if (!list.length){ v.innerHTML = '<div class="panel empty">No cards match this filter. Pick "All cards" or star some questions.</div>'; return; }
    startRound(list.map(c => c.n));
  }
  const R = S.study;
  if (!R.queue.length){ renderFinish(v); return; }
  const n = R.queue[0], c = byN[n];
  if (!c){ R.queue.shift(); persist(); render(); return; }
  const pct = 100 * R.done.length / R.total;
  v.innerHTML = '<div class="panel" id="study"><div class="qhead"><span class="done-count" id="doneCount">' + R.done.length + ' / ' + R.total + ' done</span>' +
    '<span class="row"><span class="muted" style="font-size:.88rem" id="mistakes">' + R.wrong + ' mistake' + (R.wrong === 1 ? '' : 's') + ' · ' + R.queue.length + ' left</span>' +
    '<button class="btn small ghost" id="restartRound">Restart</button></span></div>' +
    '<div class="progress"><i id="progressBar" style="width:' + pct + '%"></i></div>' +
    '<div id="qbox" data-n="' + n + '"></div>' +
    '<div class="row right" style="margin-top:14px"><button class="btn primary" id="nextBtn" style="display:none">Next →</button></div></div>' +
    '<div class="kbd hide-sm"><kbd>1</kbd>–<kbd>4</kbd> or <kbd>A</kbd>–<kbd>D</kbd> to answer · <kbd>Enter</kbd> check / next</div>';
  widget = questionWidget($('#qbox'), c, {again: R.wrongOnce.includes(n)}, (correct, d) => {
    if (d.override){
      // typed answer marked right after being graded wrong: undo the re-queue and retire it
      const idx = R.queue.indexOf(n); if (idx >= 0) R.queue.splice(idx, 1);
      if (!R.done.includes(n)) R.done.push(n);
      R.wrong = Math.max(0, R.wrong - 1);
      if (R.lastMissFirstTime){ R.wrongOnce = R.wrongOnce.filter(x => x !== n); delete S.missed[n]; }
      const st = S.stats[n]; if (st){ st.w = Math.max(0, st.w - 1); st.r++; }
    } else {
      R.attempts++;
      const firstTry = !R.wrongOnce.includes(n);
      R.queue.shift();
      const st = S.stats[n] || (S.stats[n] = {r:0, w:0});
      if (correct){
        st.r++; R.done.push(n);
        if (firstTry) delete S.missed[n];
      } else {
        st.w++; R.wrong++; S.missed[n] = true;
        R.lastMissFirstTime = firstTry;
        if (firstTry) R.wrongOnce.push(n);
        R.queue.splice(Math.min(R.queue.length, REQUEUE_GAP), 0, n);
      }
    }
    touch(); updateCount();
    $('#doneCount').textContent = R.done.length + ' / ' + R.total + ' done';
    $('#progressBar').style.width = (100 * R.done.length / R.total) + '%';
    $('#mistakes').textContent = R.wrong + ' mistake' + (R.wrong === 1 ? '' : 's') + ' · ' + R.queue.length + ' left';
    const nb = $('#nextBtn'); nb.textContent = R.queue.length ? 'Next →' : 'Finish →'; nb.style.display = ''; nb.focus({preventScroll:true});
  });
  $('#nextBtn').addEventListener('click', () => { render(); window.scrollTo({top:0}); });
  $('#restartRound').addEventListener('click', () => { if (R.done.length === 0 || confirm('Restart this round? Progress in the current round will be cleared.')){ S.study = null; touch(); render(); } });
}
function renderFinish(v){
  const R = S.study;
  const firstTry = R.total - R.wrongOnce.length;
  v.innerHTML = '<div class="panel" id="finish"><div class="result-hero"><div class="big">🎉</div><h2 style="margin:6px 0" id="finishTitle">All ' + R.total + ' questions answered correctly!</h2>' +
    '<p class="muted" style="margin:0">Round complete.</p></div>' +
    '<div class="stat-grid"><div class="stat"><b>' + firstTry + ' / ' + R.total + '</b><span>right first try</span></div><div class="stat"><b>' + R.wrong + '</b><span>mistakes along the way</span></div><div class="stat"><b>' + R.attempts + '</b><span>answers given</span></div></div>' +
    '<div class="row" style="justify-content:center"><button class="btn primary" id="restartBtn">↻ Restart round</button>' +
    '<button class="btn" id="practiceMissed"' + (R.wrongOnce.length ? '' : ' disabled') + '>Practice the ' + R.wrongOnce.length + ' I missed</button></div>' +
    (R.wrongOnce.length ? '<h3 style="margin:22px 0 0">Missed at least once</h3><div class="list">' + R.wrongOnce.map(n => { const c = byN[n]; return c ?
      '<div class="item"><div class="meta">' + badges(c) + '</div><div class="q" style="margin-top:6px">' + esc(c.q) + '</div><div class="a">✓ ' + esc(answerText(c)).replace(/\n/g, '<br>✓ ') + '</div></div>' : ''; }).join('') + '</div>' : '') +
    '</div>';
  $('#restartBtn').addEventListener('click', () => { S.study = null; touch(); render(); window.scrollTo({top:0}); });
  $('#practiceMissed').addEventListener('click', () => { startRound(R.wrongOnce.slice()); touch(); render(); window.scrollTo({top:0}); });
}

// ---------- browse & edit (answers shown instantly, no animation) ----------
let browseQ = '';
function renderBrowse(v){
  v.innerHTML = '<div class="toolbar"><input class="input search" id="bSearch" placeholder="Search questions, choices, answers…" value="' + esc(browseQ) + '"></div><div class="list" id="bList"></div>';
  const draw = () => {
    const q = browseQ.toLowerCase();
    const list = filtered().filter(c => !q || (c.q + ' ' + c.c.join(' ') + ' ' + ans(c) + ' ' + answerText(c)).toLowerCase().includes(q));
    $('#bList').innerHTML = list.length ? list.map(c => '<div class="item" data-n="' + c.n + '"><div class="meta">' + badges(c, {missed:true}) + '<span class="spacer"></span>' +
      '<button class="star' + (S.stars[c.n] ? ' on' : '') + '" data-b="star">' + (S.stars[c.n] ? '★' : '☆') + '</button><button class="btn small" data-b="edit">✎ Edit</button></div>' +
      '<div class="q" style="margin-top:6px">' + esc(c.q) + '</div><div class="a">✓ ' + esc(answerText(c)).replace(/\n/g, '<br>✓ ') + '</div></div>').join('') : '<div class="panel empty">No matching cards.</div>';
    $('#bList').querySelectorAll('[data-b]').forEach(b => b.addEventListener('click', () => {
      const c = byN[+b.closest('.item').dataset.n];
      if (b.dataset.b === 'star'){ toggleStar(c.n); draw(); } else openEdit(c, draw);
    }));
  };
  $('#bSearch').addEventListener('input', e => { browseQ = e.target.value; draw(); });
  draw();
}

// ---------- edit answer ----------
function openEdit(c, after){
  const m = $('#modal'), cur = ansSet(c), multiAllowed = !isTF(c);
  let body;
  if (isFill(c)) body = '<input class="fill-input" id="editFill" value="' + esc(ans(c)) + '">';
  else body = optIdx(c).map(i => '<label class="checkrow"><input type="' + (multiAllowed ? 'checkbox' : 'radio') + '" name="ek" value="' + L[i] + '"' + (cur.includes(L[i]) ? ' checked' : '') + '><span><b>' + L[i] + '.</b> ' + esc(c.c[i]) + '</span></label>').join('');
  m.innerHTML = '<h3>Edit answer key · #' + c.n + '</h3><p class="muted" style="margin:0 0 10px;font-size:.92rem">' + esc(c.q) + '</p>' + body +
    '<p class="muted" style="font-size:.82rem">Original key: <b>' + esc(c.a) + '</b>. ' + (multiAllowed && !isFill(c) ? 'Tick several boxes for select-all answers. ' : '') + 'Saved on this device.</p>' +
    '<div class="row right"><button class="btn ghost" id="eRevert"' + (isEdited(c) ? '' : ' disabled') + '>Revert to original</button><button class="btn" id="eCancel">Cancel</button><button class="btn primary" id="eSave">Save</button></div>';
  $('#overlay').classList.add('show');
  const close = () => $('#overlay').classList.remove('show');
  $('#eCancel').onclick = close;
  $('#eRevert').onclick = () => { delete S.edits[c.n]; touch(); close(); toast('Reverted #' + c.n); after ? after() : render(); };
  $('#eSave').onclick = () => {
    const val = isFill(c) ? $('#editFill').value.trim() : [...m.querySelectorAll('input[name="ek"]:checked')].map(x => x.value).sort().join(',');
    if (!val){ toast('Pick at least one answer'); return; }
    if (val === c.a) delete S.edits[c.n]; else S.edits[c.n] = val;
    touch(); close(); toast('Saved answer for #' + c.n); after ? after() : render();
  };
}
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') $('#overlay').classList.remove('show'); });


// ---------- cross-device sync (Supabase PostgREST RPC via plain fetch) ----------
const SYNC_CODE_KEY = 'ethicsQuiz.syncCode';
const SYNC_ENABLED = /^https?:\/\/\S+$/.test(SUPABASE_URL) && !!SUPABASE_ANON_KEY && !/^YOUR_/.test(SUPABASE_ANON_KEY);
const CODE_RE = /^[a-z0-9_-]{3,64}$/;
const Sync = {
  code: SYNC_ENABLED ? (localStorage.getItem(SYNC_CODE_KEY) || '') : '',
  status: 'off', detail: '', lastOk: 0, timer: null, inflight: null, again: false,
  retryTimer: null, retryDelay: 5000, initialPending: false, log: [],
  note(m){ this.log.push(new Date().toISOString().slice(11,23) + ' ' + m); if (this.log.length > 60) this.log.shift(); },
  active(){ return SYNC_ENABLED && !!this.code; },
  schedule(){ if (!this.active()) return; clearTimeout(this.timer); setStatus('syncing'); this.timer = setTimeout(() => { this.timer = null; push(); }, 1500); },
};
window.__ethicsQuiz_sync = Sync;
function setStatus(st, detail){
  Sync.status = st; Sync.detail = detail || '';
  if (st === 'synced') Sync.lastOk = Date.now();
  const b = $('#syncBtn'); if (!b) return;
  b.hidden = !SYNC_ENABLED;
  b.dataset.status = Sync.active() ? st : 'off';
  const label = !Sync.active() ? 'Sync off' : ({synced:'Synced', syncing:'Syncing…', offline:'Offline', error:'Sync error'}[st] || 'Sync');
  $('#syncLabel').textContent = label;
  b.title = 'Cross-device sync: ' + label + (Sync.code ? ' (code: ' + Sync.code + ')' : '') + (Sync.detail ? ' · ' + Sync.detail : '');
  const ms = $('#syncModalStatus'); if (ms) ms.textContent = statusLine();
}
function statusLine(){
  if (!Sync.active()) return 'Sync is off on this device. Progress is stored only in this browser.';
  const t = Sync.lastOk ? ' · last synced ' + new Date(Sync.lastOk).toLocaleTimeString() : '';
  return ({synced:'Synced', syncing:'Syncing…', offline:'Offline: changes are saved on this device and will upload when you reconnect', error:'Error: ' + Sync.detail}[Sync.status] || '') + t;
}
async function rpc(fn, body, opts){
  opts = opts || {};
  const headers = {'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json', 'Accept': 'application/json'};
  // Legacy anon keys are JWTs and go in Authorization too; new sb_publishable_ keys must only be sent as apikey.
  if (/^eyJ/.test(SUPABASE_ANON_KEY)) headers['Authorization'] = 'Bearer ' + SUPABASE_ANON_KEY;
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), opts.timeout || 10000);
  let r;
  try {
    r = await fetch(SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {method:'POST', headers, body: JSON.stringify(body),
      keepalive: !!opts.keepalive, cache:'no-store', signal: opts.keepalive ? undefined : ctl.signal});
  } catch(e){ const err = new Error('network'); err.offline = true; throw err; }
  finally { clearTimeout(to); }
  if (!r.ok){ let msg = 'HTTP ' + r.status; try { const j = await r.json(); if (j && j.message) msg = j.message; } catch(e){} const err = new Error(msg); err.http = r.status; throw err; }
  return r.json();
}
function onSyncError(e){
  if (e.offline){ setStatus('offline'); scheduleRetry(); }
  else setStatus('error', e.message);
}
function scheduleRetry(){
  clearTimeout(Sync.retryTimer);
  Sync.retryTimer = setTimeout(() => { if (Sync.active()) pull(); }, Sync.retryDelay);
  Sync.retryDelay = Math.min(Sync.retryDelay * 2, 60000);
}
// Postgres timestamps can carry microseconds; round them UP to the next millisecond so a later
// re-push of the same moment compares >= the stored value.
function parseTs(v){
  const ms = Date.parse(v); if (isNaN(ms)) return 0;
  const m = /\.(\d+)/.exec(String(v)); return (m && m[1].length > 3 && /[1-9]/.test(m[1].slice(3))) ? ms + 1 : ms;
}
function adoptRemote(state, ts){
  Sync.note('adopt remote ' + ts);
  const f = fresh(); Object.keys(f).forEach(k => { if (state && k in state) f[k] = state[k]; });
  f.tab = S.tab;                 // which tab is open stays per-device
  f.updatedAt = ts;
  S = f; persist();
  // Don't yank the screen away while the user is looking at feedback; Next will show the synced state.
  const nb = $('#nextBtn');
  if (S.tab === 'study' && !Sync.initialPending && nb && nb.style.display !== 'none'){ updateCount(); return; }
  render();
}
// Pull remote, then last-write-wins on the whole state: newer remote → adopt; newer local → push.
async function pull(depth){
  if (!Sync.active()) return;
  Sync.note('pull d=' + (depth || 0));
  depth = depth || 0;
  setStatus('syncing');
  try {
    const rows = await rpc('get_progress', {p_code: Sync.code}, {timeout: 8000});
    const row = rows && rows[0];
    Sync.retryDelay = 5000;
    if (!row){ if (S.updatedAt > 0) await push(depth + 1); else setStatus('synced'); return; }
    const remoteTs = parseTs(row.updated_at), localTs = S.updatedAt || 0;
    if (remoteTs > localTs) { adoptRemote(row.state, remoteTs); setStatus('synced'); }
    else if (localTs > remoteTs && depth < 3) await push(depth + 1);
    else setStatus('synced');
  } catch(e){ onSyncError(e); }
}
async function push(depth, opts){
  if (!Sync.active()) return;
  clearTimeout(Sync.timer); Sync.timer = null;
  if (Sync.inflight){ Sync.again = true; return Sync.inflight; }
  depth = depth || 0;
  if (!S.updatedAt){ S.updatedAt = Date.now(); persist(); }
  const sentTs = S.updatedAt;
  Sync.note('push ' + sentTs + (opts && opts.keepalive ? ' keepalive' : ''));
  setStatus('syncing');
  Sync.inflight = (async () => {
    try {
      const rows = await rpc('save_progress', {p_code: Sync.code, p_state: S, p_updated_at: new Date(sentTs).toISOString()}, opts);
      const row = rows && rows[0];
      Sync.retryDelay = 5000;
      if (row && row.applied === false){ Sync.inflight = null; if (depth < 3) await pull(depth + 1); return; }
      if (row && row.updated_at){ const t = parseTs(row.updated_at); if (S.updatedAt === sentTs && t !== sentTs){ S.updatedAt = t; persist(); } }
      setStatus(S.updatedAt === sentTs || (row && parseTs(row.updated_at) === S.updatedAt) ? 'synced' : 'syncing');
    } catch(e){ onSyncError(e); }
    finally { Sync.inflight = null; }
  })();
  await Sync.inflight;
  if (Sync.again){ Sync.again = false; return push(); }
  if (Sync.status === 'syncing' && !Sync.timer) Sync.schedule();   // changed while uploading
}
function flushNow(){ if (Sync.active() && Sync.timer){ clearTimeout(Sync.timer); Sync.timer = null; push(0, {keepalive: true}); } }
async function initialSync(){
  if (!Sync.active()) return;
  Sync.initialPending = true; render();
  const guard = setTimeout(() => { if (Sync.initialPending){ Sync.initialPending = false; render(); } }, 9000);
  await pull();
  clearTimeout(guard);
  if (Sync.initialPending){ Sync.initialPending = false; render(); }
}
function summary(st){ const d = st && st.study; return d ? d.done.length + ' / ' + d.total + ' done' : 'no round started'; }
// Connect (or change) the sync code. If both this device and the cloud already have progress, let the user choose.
async function connectCode(code){
  clearTimeout(Sync.timer); Sync.timer = null; clearTimeout(Sync.retryTimer);
  Sync.code = code; localStorage.setItem(SYNC_CODE_KEY, code); Sync.retryDelay = 5000;
  setStatus('syncing');
  let row;
  try { const rows = await rpc('get_progress', {p_code: code}); row = rows && rows[0]; }
  catch(e){ onSyncError(e); return {done:true}; }
  if (!row){ await push(); return {done:true}; }
  if (!(S.updatedAt > 0)){ adoptRemote(row.state, parseTs(row.updated_at)); setStatus('synced'); return {done:true}; }
  return {conflict: row};
}
function openSync(){
  const m = $('#modal');
  const draw = (conflictRow) => {
    m.innerHTML = '<h3>Sync across devices</h3>' +
      '<p class="muted" style="margin:0 0 8px;font-size:.92rem">Enter the same sync code on each device. No account needed; progress, stars, edited answers and stats are synced.</p>' +
      '<div class="sync-note"><b>Your sync code works like a password.</b> Anyone who knows it can see and change your progress, so pick something hard to guess (e.g. <code>thomas-ethics-7k3p</code>).</div>' +
      '<label style="font-size:.9rem;font-weight:600" for="syncCodeIn">Sync code</label>' +
      '<input class="fill-input" id="syncCodeIn" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. thomas-ethics-7k3p" value="' + esc(Sync.code) + '">' +
      '<div class="muted" style="font-size:.8rem;margin-top:4px">3–64 characters: lowercase letters, digits, - or _</div>' +
      (conflictRow ? '<div class="choice-box" id="syncConflict"><b>Both this device and the cloud already have progress for this code.</b>' +
        '<div style="font-size:.9rem">Cloud: ' + esc(summary(conflictRow.state)) + ' · saved ' + esc(new Date(conflictRow.updated_at).toLocaleString()) + '<br>This device: ' + esc(summary(S)) + ' · saved ' + esc(new Date(S.updatedAt).toLocaleString()) + '</div>' +
        '<div class="row"><button class="btn primary" id="useCloud">Use cloud progress</button><button class="btn" id="useLocal">Keep this device\'s (overwrite cloud)</button></div></div>' : '') +
      '<div class="sync-status muted" id="syncModalStatus">' + esc(statusLine()) + '</div>' +
      '<div class="row right" style="margin-top:14px">' +
        (Sync.code ? '<button class="btn ghost" id="syncOff">Turn off sync here</button><button class="btn" id="syncNow">Sync now</button>' : '') +
        '<button class="btn" id="syncClose">Close</button><button class="btn primary" id="syncSave">' + (Sync.code ? 'Save code' : 'Start syncing') + '</button></div>';
    const close = () => $('#overlay').classList.remove('show');
    $('#syncClose').onclick = close;
    const off = $('#syncOff'); if (off) off.onclick = () => { clearTimeout(Sync.timer); clearTimeout(Sync.retryTimer); Sync.code = ''; localStorage.removeItem(SYNC_CODE_KEY); setStatus('off'); toast('Sync turned off on this device (progress kept locally)'); draw(); };
    const now = $('#syncNow'); if (now) now.onclick = () => pull();
    $('#syncSave').onclick = async () => {
      const code = $('#syncCodeIn').value.trim().toLowerCase();
      if (!CODE_RE.test(code)){ toast('Use 3–64 characters: a–z, 0–9, - or _'); $('#syncCodeIn').focus(); return; }
      if (code === Sync.code && !conflictRow){ pull(); close(); return; }
      const res = await connectCode(code);
      if (res.conflict) draw(res.conflict); else { close(); toast(Sync.status === 'synced' ? 'Sync on: ' + code : 'Sync code saved'); }
    };
    $('#syncCodeIn').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); $('#syncSave').click(); } });
    const uc = $('#useCloud'); if (uc) uc.onclick = () => { adoptRemote(conflictRow.state, parseTs(conflictRow.updated_at)); setStatus('synced'); close(); toast('Loaded cloud progress'); };
    const ul = $('#useLocal'); if (ul) ul.onclick = async () => { S.updatedAt = Math.max(Date.now(), parseTs(conflictRow.updated_at) + 1); persist(); close(); await push(); toast('Uploaded this device\'s progress'); };
  };
  draw();
  $('#overlay').classList.add('show');
}
$('#syncBtn').addEventListener('click', openSync);
document.addEventListener('visibilitychange', () => { Sync.note('visibility ' + document.visibilityState); if (document.visibilityState === 'hidden') flushNow(); else if (Sync.active() && !Sync.timer && !Sync.inflight) pull(); });
window.addEventListener('pagehide', flushNow);
window.addEventListener('online', () => { if (Sync.active()) pull(); });
window.addEventListener('offline', () => { if (Sync.active()) setStatus('offline'); });

// ---------- export ----------
function csvCell(s){ s = String(s == null ? '' : s); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function buildCSV(){
  const rows = [['Question','A','B','C','D','Answer','AnswerText','Edited']];
  DECK.forEach(c => rows.push([c.q, c.c[0], c.c[1], c.c[2], c.c[3], isFill(c) ? '' : ans(c), isEdited(c) ? answerText(c).replace(/^[A-D]\. /gm, '') : c.at, isEdited(c) ? 'yes' : 'no']));
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}
window.__ethicsQuiz = {buildCSV: buildCSV, deck: DECK, state: () => S};
$('#exportBtn').addEventListener('click', () => {
  const blob = new Blob(['\ufeff' + buildCSV()], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ethics_quiz_export.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('CSV exported (' + Object.keys(S.edits).length + ' edited answers)');
});
$('#resetBtn').addEventListener('click', () => {
  if (!confirm('Reset all progress (stars, missed, stats, current round)? Your edited answers are kept.')) return;
  const edits = S.edits; S = fresh(); S.edits = edits; touch(); render(); toast('Progress reset');
});

// ---------- events ----------
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#filterSel').addEventListener('change', e => {
  const prev = S.filter; S.filter = e.target.value;
  if (S.tab === 'study' && S.study && S.study.done.length && !confirm('Start a new round with this card filter? Current round progress will be cleared.')){ S.filter = prev; e.target.value = prev; return; }
  S.study = null; touch(); render();
});
document.addEventListener('keydown', e => {
  if ($('#overlay').classList.contains('show')){ if (e.key === 'Escape') $('#overlay').classList.remove('show'); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select') return;
  if (e.metaKey || e.ctrlKey || e.altKey || S.tab !== 'study') return;
  if (widget && widget.key(e.key)){ e.preventDefault(); return; }
  const nb = $('#nextBtn');
  if ((e.key === 'Enter' || e.key === 'ArrowRight') && nb && nb.style.display !== 'none' && document.activeElement !== nb){ e.preventDefault(); nb.click(); }
});
setStatus(Sync.active() ? 'syncing' : 'off');
render();
initialSync();
})();
</script>
</body>
