<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:,">
<title>Computer Ethics · Study</title>
<style>
:root{
  --bg:#f5f6fb; --panel:#ffffff; --text:#1c1f2e; --muted:#6b7084; --line:#e3e5ef;
  --accent:#4f46e5; --accent-2:#6366f1; --accent-soft:#eef0ff;
  --good:#12a150; --good-soft:#e3f6ea; --bad:#e5484d; --bad-soft:#fdeaea;
  --star:#f5a524; --radius:16px; --shadow:0 1px 2px rgba(20,22,40,.06),0 8px 24px rgba(20,22,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1117; --panel:#181b25; --text:#e8eaf3; --muted:#9aa0b6; --line:#2a2f3e;
    --accent:#818cf8; --accent-2:#6366f1; --accent-soft:#232848; --good:#3ecf7a; --good-soft:#15301f;
    --bad:#ff6b6f; --bad-soft:#3a1b1d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);
  line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1600px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:1.15rem;letter-spacing:-.01em;min-width:0}
.logo{flex:none;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#a855f7);display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:var(--shadow)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.spacer{flex:1}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px}
.tab{flex:1;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.select,.btn,.input{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px}
.btn{font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.count{color:var(--muted);font-size:.9rem}
.panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.b-num{background:var(--accent-soft);color:var(--accent)}
.b-type{background:var(--line);color:var(--muted)}
.b-edit{background:var(--good-soft);color:var(--good)}
.b-missed{background:var(--bad-soft);color:var(--bad)}
.b-again{background:var(--bad-soft);color:var(--bad)}
.star{border:0;background:transparent;font-size:1.35rem;line-height:1;color:var(--muted);padding:4px}
.star.on{color:var(--star)}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qtext{font-size:1.15rem;font-weight:620;letter-spacing:-.005em}
.letter{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:750;font-size:.85rem;background:var(--accent-soft);color:var(--accent)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress > i{display:block;height:100%;background:var(--good)}
.next-btn{position:relative;overflow:hidden}
.next-btn .auto-fill{position:absolute;left:0;bottom:0;height:4px;width:0;background:rgba(255,255,255,.75);pointer-events:none}
.next-btn[data-auto="paused"] .auto-fill{opacity:.45}
.auto-toggle{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.auto-toggle input{appearance:none;-webkit-appearance:none;margin:0;position:relative;width:30px;height:17px;border-radius:99px;background:var(--line);cursor:pointer;flex:none;transition:background .15s}
.auto-toggle input::before{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.auto-toggle input:checked{background:var(--accent)}
.auto-toggle input:checked::before{left:15px}
.auto-toggle input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.done-count{font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.correct .letter{background:var(--good);color:#fff}
.opt.wrong .letter{background:var(--bad);color:#fff}
.opt.missedopt{border-style:dashed}
.opt.missedopt::after{content:'missed';margin-left:auto;font-size:.72rem;font-weight:700;color:var(--good);text-transform:uppercase;align-self:center}
.opt[disabled]{cursor:default}
.opts.tf{flex-direction:row}
.opts.tf .opt{justify-content:center;font-weight:700;font-size:1.05rem;padding:16px}
.feedback{border-radius:12px;padding:10px 14px;margin-top:4px;display:flex;flex-direction:column;gap:4px}
.feedback.good{background:var(--good-soft);border:1px solid var(--good)}
.feedback.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.feedback.good strong.t{color:var(--good)} .feedback.bad strong.t{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{justify-content:flex-end}
.result-hero{text-align:center;padding:10px 0 18px}
.result-hero .big{font-size:3rem;font-weight:800;letter-spacing:-.03em}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel)}
.item .q{font-weight:600}
.item .a{color:var(--good);font-weight:600;margin-top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:12px;padding:12px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:1.5rem}
.stat span{color:var(--muted);font-size:.8rem}
.overlay{position:fixed;inset:0;background:rgba(10,12,25,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.overlay.show{display:flex}
@media (min-width:640px){.overlay{align-items:center}}
.modal{background:var(--panel);border-radius:20px;max-width:560px;width:100%;padding:20px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
.checkrow input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:90vw;bottom:24px;background:var(--text);color:var(--panel);padding:10px 16px;border-radius:12px;display:none;z-index:60;font-weight:600}
.toast.show{display:block}
.search{flex:1;min-width:180px}
.sync-btn .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync-btn[data-status="synced"] .dot{background:var(--good)}
.sync-btn[data-status="syncing"] .dot{background:var(--accent)}
.sync-btn[data-status="offline"] .dot{background:var(--star)}
.sync-btn[data-status="error"] .dot{background:var(--bad)}
.sync-btn[data-status="error"]{border-color:var(--bad)}
.sync-note{font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.sync-status{font-size:.85rem;margin:8px 0 0}
.choice-box{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.fill-input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);font-size:1.05rem}
.fill-input:focus{outline:none;border-color:var(--accent)}
.fill-input.correct{border-color:var(--good);background:var(--good-soft)}
.fill-input.wrong{border-color:var(--bad);background:var(--bad-soft)}
kbd{font-family:inherit;font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--panel)}
.kbd{font-size:.78rem;color:var(--muted);text-align:center;margin-top:10px}
@media (max-width:560px){
  .wrap{padding:12px 12px 28px}
  .qtext{font-size:1.05rem}
  .hide-sm{display:none}
  .opts.tf{flex-direction:column}
  header.top{gap:8px}
  .sync-btn #syncLabel{display:none}
  button.brand{font-size:1.02rem;gap:8px;padding-right:6px}
  button.brand .logo{width:30px;height:30px;font-size:16px}
  #brandName{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
  .brand small{font-size:.72rem}
  .sync-btn{padding:9px 10px}
}
/* ---- sets sidebar ---- */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.maincol{min-width:0}
.sidebar{position:sticky;top:12px;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 24px);overflow:auto}
.sidebar h4{margin:2px 6px 8px;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center}
.set-item{display:flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:8px 8px 8px 10px;cursor:pointer}
.set-item:hover{background:var(--bg)}
.set-item.active{background:var(--accent-soft);border-color:var(--accent)}
.set-item.active .set-name{color:var(--accent)}
.set-name{flex:1;min-width:0;font-weight:600;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;text-align:left;padding:0}
.set-count{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.set-actions{display:none;gap:0}
.set-item.active .set-actions{display:flex}
.icon-btn{border:0;background:transparent;padding:3px 5px;border-radius:7px;color:var(--muted);font-size:.85rem;line-height:1}
.icon-btn:hover{background:var(--line);color:var(--text)}
.icon-btn.danger:hover{background:var(--bad-soft);color:var(--bad)}
.icon-btn.danger{filter:grayscale(1);opacity:.7}
.icon-btn.danger:hover{filter:none;opacity:1}
.new-set{margin-top:8px;justify-content:center;border-style:dashed;width:100%}
.side-hint{font-size:.74rem;color:var(--muted);text-align:center;margin-top:4px}
.sidebar.drag{outline:2px dashed var(--accent);outline-offset:-4px}
header.top .btn{white-space:nowrap;flex:none}
.brand > .brand-text{min-width:0;display:block;text-align:left}
button.brand{border:1px solid transparent;background:transparent;padding:4px 10px 4px 4px;margin-left:-5px;border-radius:14px;color:inherit;font:inherit;font-weight:750;font-size:1.15rem;cursor:pointer}
button.brand:hover{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
button.brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.brand[aria-expanded="true"] .brand-glyph{color:var(--accent);background:var(--accent-soft)}
.brand-glyph{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:.8rem;line-height:1;color:var(--muted);background:var(--line)}
button.brand:hover .brand-glyph{color:var(--accent);background:var(--accent-soft)}
@media (min-width:761px){
  body.sb-collapsed .layout{grid-template-columns:minmax(0,1fr)}
  body.sb-collapsed .sidebar{display:none}
}
#brandName{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-backdrop{display:none}
.drawer-only{display:none}
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;margin:10px 0}
.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
.import-ok{color:var(--good);font-weight:700}
.import-skip{color:var(--bad);font-weight:700}
.skip-list{margin:6px 0 0;padding-left:18px;font-size:.86rem;max-height:160px;overflow:auto}
.fmt-help{font-size:.82rem;color:var(--muted)}
.fmt-help code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 4px}
/* ---- wide screens: fill the window, scale up a little ---- */
@media (min-width:761px){
  .wrap{padding:20px clamp(24px,2.5vw,40px) calc(36px + env(safe-area-inset-bottom))}
}
@media (min-width:1280px){
  html{font-size:17px}
  .layout{grid-template-columns:260px minmax(0,1fr);gap:24px}
  .panel{padding:26px 28px}
  .opts{gap:12px;margin:20px 0}
  .opt{padding:14px 18px;gap:14px}
  .letter{width:30px;height:30px;font-size:.9rem}
  .qtext{font-size:1.25rem}
  .opts.tf .opt{padding:20px}
  .tab{padding:11px 14px}
  .set-item{padding:9px 10px 9px 12px}
  .modal{max-width:620px;padding:24px}
}
@media (min-width:1600px){
  html{font-size:18px}
  .layout{grid-template-columns:280px minmax(0,1fr);gap:28px}
  .panel{padding:30px 34px}
  .opt{padding:16px 20px}
  .qtext{font-size:1.3rem}
  .modal{max-width:680px}
}
@media (min-width:2200px){
  html{font-size:20px}
  .wrap{max-width:1900px}
  .layout{grid-template-columns:310px minmax(0,1fr);gap:32px}
  .modal{max-width:760px}
}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(84vw,320px);max-height:none;border-radius:0 18px 18px 0;z-index:45;display:none;padding-top:16px}
  .sidebar.open{display:flex}
  .set-actions{display:flex}
  .drawer-only{display:inline-block}
  .drawer-backdrop.show{display:block;position:fixed;inset:0;background:rgba(10,12,25,.45);z-index:44}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="brandBtn" type="button" aria-controls="sidebar" aria-expanded="true" title="Show / hide sets"><span class="logo" aria-hidden="true">⚖︎</span><span class="brand-glyph" aria-hidden="true">☰</span><span class="brand-text"><span id="brandName">Computer Ethics</span><small id="subtitle">Study deck</small></span></button>
    <div class="spacer"></div>
    <button class="btn small sync-btn" id="syncBtn" hidden title="Cross-device sync"><span class="dot"></span><span id="syncLabel">Sync</span></button>
    <button class="btn small" id="exportBtn" title="Download this set as CSV (includes your edited answers)">⬇ <span class="hide-sm">Export</span> CSV</button>
    <button class="btn small ghost" id="resetBtn" title="Reset progress for this set">↺ <span class="hide-sm">Reset</span></button>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Question sets"></aside>
    <section class="maincol">
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="study">Study</button>
        <button class="tab" role="tab" data-tab="browse">Browse &amp; edit</button>
      </nav>
      <div class="toolbar">
        <label class="muted" for="filterSel" style="font-size:.9rem">Cards:</label>
        <select class="select" id="filterSel">
          <option value="all">All cards</option>
          <option value="starred_missed">Starred / Missed</option>
          <option value="starred">Starred only</option>
          <option value="missed">Missed only</option>
        </select>
        <span class="count" id="filterCount"></span>
      </div>
      <main id="view"></main>
    </section>
  </div>
</div>
<div class="drawer-backdrop" id="backdrop"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".csv,.tsv,.txt,text/csv,text/plain" hidden>

/* ======================================================================== */
(function(){
'use strict';
const DECK = JSON.parse(document.getElementById('deck-data').textContent);

const SYNC_SOFT_LIMIT_KB = 1024;        // server cap after supabase_migration_002.sql (200 KB before it)

// ---------- state ----------
// Saved state (localStorage + cloud):
//   {v:1, schema:2, updatedAt, tab, active, order:[setId...], sets:{id:{id,name,builtin,cards?,filter,stars,missed,edits,stats,study}},
//    filter, stars, missed, edits, stats, study}   <- top-level copies of the built-in set, so an older
//                                                     single-deck app (v:1) still reads Computer Ethics progress.
function blankProgress(){ return {filter:'all', stars:{}, missed:{}, edits:{}, stats:{}, study:null}; }
function obj(x){ return x && typeof x === 'object' && !Array.isArray(x) ? x : {}; }
function cleanProgress(src){
  src = obj(src);
  const st = src.study && typeof src.study === 'object' && Array.isArray(src.study.queue) && Array.isArray(src.study.done) ? src.study : null;
  return {filter: typeof src.filter === 'string' ? src.filter : 'all', stars: obj(src.stars), missed: obj(src.missed),
    edits: obj(src.edits), stats: obj(src.stats), study: st};
}
function migrate(raw){
  raw = obj(raw);
  const out = {v:1, schema:2, updatedAt: +raw.updatedAt || 0, tab: raw.tab === 'browse' ? 'browse' : 'study', active: BUILTIN_ID, order: [BUILTIN_ID], sets: {}};
  if (raw.sets && typeof raw.sets === 'object'){
    const ids = (Array.isArray(raw.order) ? raw.order : []).concat(Object.keys(raw.sets));
    ids.forEach(id => {
      const s = raw.sets[id]; if (!s || out.sets[id]) return;
      if (id === BUILTIN_ID){ out.sets[id] = Object.assign({id, name: BUILTIN_NAME, builtin: true}, cleanProgress(s)); return; }
      if (!Array.isArray(s.cards) || !s.cards.length) return;
      out.sets[id] = Object.assign({id, name: String(s.name || 'Untitled set').slice(0, 80), builtin: false, created: +s.created || 0, cards: s.cards}, cleanProgress(s));
      out.order.push(id);

    if (raw.sets[raw.active] && out.sets[raw.active]) out.active = raw.active;
  }
  out.deleted = {}; Object.keys(obj(raw.deleted)).forEach(id => { if (id !== BUILTIN_ID) out.deleted[id] = +raw.deleted[id] || 1; });
  Object.keys(out.deleted).forEach(id => { if (out.sets[id]){ delete out.sets[id]; } });
  out.order = out.order.filter(id => out.sets[id] || id === BUILTIN_ID);
  if (!out.sets[out.active] && out.active !== BUILTIN_ID) out.active = BUILTIN_ID;
  // schema-1 state (single deck) or a missing built-in set: take progress from the top-level fields
  if (!out.sets[BUILTIN_ID]) out.sets[BUILTIN_ID] = Object.assign({id: BUILTIN_ID, name: BUILTIN_NAME, builtin: true}, cleanProgress(raw));

}
function serialize(){
  const ce = S.sets[BUILTIN_ID];
  return Object.assign({}, S, {filter: ce.filter, stars: ce.stars, missed: ce.missed, edits: ce.edits, stats: ce.stats, study: ce.study});
}
function load(){
  try { const raw = JSON.parse(localStorage.getItem(KEY)); if (raw) return migrate(raw); } catch(e){}
  return migrate(null);
}
let S = load();
// persist(): write the local cache only (no "real" change, e.g. tab/set switch or auto-started round).
// touch():   a user change (answer, star, edit, restart, reset, filter, set upload/rename/delete); bumps updatedAt and schedules a sync push.
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(serialize())); } catch(e){ toast('Could not save locally (storage full?)'); } }
function touch(){ S.updatedAt = Date.now(); persist(); Sync.schedule(); }

// ---------- sets ----------
function cs(){ return S.sets[S.active] || S.sets[BUILTIN_ID]; }          // current set (progress lives here)
function setCards(set){ return set.builtin ? DECK : set.cards; }
function cards(){ return setCards(cs()); }
const indexCache = new WeakMap();
function cardMap(arr){ let m = indexCache.get(arr); if (!m){ m = {}; arr.forEach(c => m[c.n] = c); indexCache.set(arr, m); } return m; }
function byN(n){ return cardMap(cards())[n]; }
function setProgress(set){
  const total = setCards(set).length;
  if (set.study) return {done: set.study.done.length, total: set.study.total};
  return {done: 0, total};
}

// ---------- helpers ----------
const $ = s => document.querySelector(s);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function isEdited(c){ return Object.prototype.hasOwnProperty.call(cs().edits, c.n); }
function ans(c){ return isEdited(c) ? cs().edits[c.n] : c.a; }
function isFill(c){ return c.type === 'fill'; }
function isTF(c){ return c.type === 'tf'; }
function optIdx(c){ const r = []; c.c.forEach((t, i) => { if (String(t == null ? '' : t).trim() !== '') r.push(i); }); return r; }
function ansSet(c){ return ans(c).split(',').map(s => s.trim().toUpperCase()).filter(Boolean); }
function isMulti(c){ return !isFill(c) && (/select all/i.test(c.q) || ansSet(c).length > 1); }
function answerText(c){
  if (isFill(c)) return ans(c);
  return ansSet(c).map(l => { const i = L.indexOf(l); return l + '. ' + (i >= 0 ? c.c[i] : '?'); }).join('\n');
}
function typeLabel(c){ return isFill(c) ? 'Type answer' : isTF(c) ? 'True/False' : isMulti(c) ? 'Select all' : 'Multiple choice'; }
function badges(c, opts){
  opts = opts || {};
  let h = '<span class="badge b-num">#' + c.n + '</span><span class="badge b-type">' + typeLabel(c) + '</span>';
  if (isEdited(c)) h += '<span class="badge b-edit" title="You edited this answer">✎ edited</span>';
  if (opts.missed && cs().missed[c.n]) h += '<span class="badge b-missed">missed</span>';
  if (opts.again) h += '<span class="badge b-again" title="You missed this one earlier this round">↻ again</span>';
  return h;
}
function filtered(){
  const P = cs(), f = P.filter;
  return cards().filter(c => f === 'all' || (f === 'starred' && P.stars[c.n]) || (f === 'missed' && P.missed[c.n]) ||
    (f === 'starred_missed' && (P.stars[c.n] || P.missed[c.n])));
}
function toast(msg, ms){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms || 2200); }
function norm(s){ return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function checkFill(c, input){
  const a = norm(ans(c)), u = norm(input);
  if (!u) return false;
  if (u === a) return true;
  const qWords = new Set(norm(c.q).split(' '));
  const keyWords = a.split(' ').filter(w => w.length >= 4 && !qWords.has(w));
  const uw = new Set(u.split(' '));
  return keyWords.length > 0 && keyWords.every(w => uw.has(w) || [...uw].some(x => x.length >= 5 && (w.startsWith(x) || x.startsWith(w))));
}
function sameSet(a, b){ return [...a].sort().join(',') === [...b].sort().join(','); }
function toggleStar(n){ const P = cs(); if (P.stars[n]) delete P.stars[n]; else P.stars[n] = true; touch(); updateCount(); }

// ---------- top-level ----------
function setTab(t){ S.tab = t; persist(); render(); }
function updateCount(){
  const P = cs(), all = cards();
  $('#filterCount').textContent = filtered().length + ' of ' + all.length + ' cards';
  $('#brandName').textContent = P.name;
  $('#subtitle').textContent = all.length + ' cards · ' + Object.keys(P.stars).length + ' starred · ' + Object.keys(P.missed).length + ' missed';
  document.title = P.name + ' · Study';
  renderSidebar();
}
function render(){
  autoCancel();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));

  const v = $('#view'); v.innerHTML = '';
  (S.tab === 'browse' ? renderBrowse : renderStudy)(v);
}
// ---------- question widget ----------
// Renders one question into el. Calls onAnswer(correct, {override}) when answered.
function questionWidget(el, c, opts, onAnswer){
  const multi = isMulti(c), tf = isTF(c), fill = isFill(c);
  const sel = new Set(); let answered = false;
  let html = '<div class="meta">' + badges(c, {again: opts.again}) + '<span class="spacer"></span><button class="star' + (cs().stars[c.n] ? ' on' : '') + '" data-w="star" title="Star">' + (cs().stars[c.n] ? '★' : '☆') + '</button></div>' +
    '<div class="qtext" style="margin-top:10px">' + esc(c.q) + '</div>';
  if (multi) html += '<div class="muted" style="font-size:.85rem;margin-top:6px">Select all that apply, then press Check.</div>';
  if (fill){
    html += '<div style="margin:16px 0"><input class="fill-input" id="fillIn" placeholder="Type your answer…" autocomplete="off"></div>' +
      '<div class="row"><button class="btn primary" data-w="check">Check</button><button class="btn ghost" data-w="dontknow">I don\'t know</button></div>';
  } else {
    html += '<div class="opts' + (tf ? ' tf' : '') + '">' + optIdx(c).map(i =>
      '<button class="opt" data-letter="' + L[i] + '">' + (tf ? '' : '<span class="letter">' + L[i] + '</span>') + '<span>' + esc(c.c[i]) + '</span></button>').join('') + '</div>';
    if (multi) html += '<div class="row"><button class="btn primary" data-w="check" disabled>Check</button></div>';
  }
  html += '<div id="fb"></div>';
  el.innerHTML = html;
  const fb = el.querySelector('#fb');
  el.querySelector('[data-w="star"]').addEventListener('click', e => { const b = e.currentTarget; toggleStar(c.n); b.classList.toggle('on', !!cs().stars[c.n]); b.textContent = cs().stars[c.n] ? '★' : '☆'; });
  function finish(correct, typed){
    answered = true;
    const set = ansSet(c);
    el.querySelectorAll('.opt').forEach(b => { b.disabled = true; const l = b.dataset.letter; b.classList.remove('sel');
      if (set.includes(l)){ b.classList.add('correct'); if (multi && !sel.has(l)) b.classList.add('missedopt'); } else if (sel.has(l)) b.classList.add('wrong'); });
    el.querySelectorAll('[data-w="check"],[data-w="dontknow"]').forEach(b => b.disabled = true);
    const fi = el.querySelector('#fillIn'); if (fi){ fi.disabled = true; fi.classList.add(correct ? 'correct' : 'wrong'); }
    // No feedback box: the green/red choices say it all. Only a wrong typed answer
    // (no choices to color) shows the correct answer, plus the "I was right" override.
    if (fill && !correct) {
      fb.innerHTML = '<div class="feedback bad" id="feedback" data-correct="false"><div class="row">' +
        '<div><b>Answer:</b> ' + esc(answerText(c)).replace(/\n/g, '<br>') + '</div><span class="spacer"></span>' +
        (typed ? '<button class="btn small" data-w="override">I was right</button>' : '') + '</div></div>';
      const ov = fb.querySelector('[data-w="override"]');
      if (ov) ov.addEventListener('click', () => {
        fb.innerHTML = ''; if (fi){ fi.classList.remove('wrong'); fi.classList.add('correct'); }
        onAnswer(true, {override:true});
      });
    } else fb.innerHTML = '';
    onAnswer(correct, {});
  }
  el.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    if (answered) return;
    const l = b.dataset.letter;
    if (multi){ if (sel.has(l)) sel.delete(l); else sel.add(l); b.classList.toggle('sel', sel.has(l)); el.querySelector('[data-w="check"]').disabled = sel.size === 0; }
    else { sel.add(l); finish(sameSet(sel, ansSet(c))); }
  }));
  const chk = el.querySelector('[data-w="check"]');
  if (chk) chk.addEventListener('click', () => {
    if (answered) return;
    if (fill){ const fi = el.querySelector('#fillIn'), val = fi.value; if (!val.trim()){ fi.focus(); return; } finish(checkFill(c, val), val); }
    else finish(sameSet(sel, ansSet(c)));
  });
  const dk = el.querySelector('[data-w="dontknow"]'); if (dk) dk.addEventListener('click', () => { if (!answered) finish(false, ''); });
  const fi = el.querySelector('#fillIn');
  if (fi){ fi.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); chk.click(); } }); setTimeout(() => fi.focus(), 30); }
  return {
    key(k){
      if (answered || fill) return false;
      const m = {'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'a':0,'b':1,'c':2,'d':3,'e':4,'f':5}[k.toLowerCase()];
      if (m !== undefined){ const b = el.querySelector('.opt[data-letter="' + L[m] + '"]'); if (b){ b.click(); return true; } }
      if (k === 'Enter' && multi && chk && !chk.disabled){ chk.click(); return true; }
      return false;
    },
    get answered(){ return answered; }
  };
}

// ---------- auto-advance ----------
// After an answer the app moves on by itself. Next / Enter / → skip the wait. Any re-render (set, tab, restart,
// reset, sync) cancels it; it pauses while the tab is hidden, a modal is open, or the pointer/focus is on the
// typed-answer row. Per-device setting (localStorage, not synced).
const AUTO_NEXT_MS = {correct: 3000, wrong: 4500, typedWrong: 6000};   // <- tweak delays here
const AUTO_KEY = 'ethicsQuiz.autoNext';
const Auto = {on: true, active: false, token: 0, timer: null, total: 0, remaining: 0, startedAt: 0, fire: null, hold: new Set()};
try { Auto.on = localStorage.getItem(AUTO_KEY) !== 'off'; } catch(e){}
function autoBlocked(){ return document.visibilityState === 'hidden' || $('#overlay').classList.contains('show') || Auto.hold.size > 0; }
function autoPaint(running){
  const nb = $('#nextBtn'); if (!nb) return;
  const f = nb.querySelector('.auto-fill');
  nb.dataset.auto = Auto.active ? (running ? 'running' : 'paused') : 'off';
  if (!f) return;
  const frac = Auto.active && Auto.total ? Math.min(1, 1 - Auto.remaining / Auto.total) : 0;
  f.style.transition = 'none'; f.style.width = (frac * 100) + '%';
  if (Auto.active && running){ void f.offsetWidth; f.style.transition = 'width ' + Math.round(Auto.remaining) + 'ms linear'; f.style.width = '100%'; }
}
function autoCancel(){ Auto.token++; clearTimeout(Auto.timer); Auto.timer = null; Auto.active = false; Auto.fire = null; Auto.hold.clear(); autoPaint(false); }
function autoStart(ms, fire){
  autoCancel();
  if (!Auto.on) return;
  Auto.active = true; Auto.total = Auto.remaining = ms; Auto.fire = fire;
  autoUpdate();
}
function autoUpdate(){
  if (!Auto.active) return;
  const blocked = autoBlocked();
  if (blocked && Auto.timer){
    clearTimeout(Auto.timer); Auto.timer = null;
    Auto.remaining = Math.max(0, Auto.remaining - (performance.now() - Auto.startedAt));
    autoPaint(false);
  } else if (!blocked && !Auto.timer){
    Auto.startedAt = performance.now();
    const tok = Auto.token;
    Auto.timer = setTimeout(() => {
      if (tok !== Auto.token || !Auto.active) return;
      Auto.timer = null;
      if (autoBlocked()){ Auto.remaining = 0; autoPaint(false); return; }   // never fire while blocked; resumes on unblock
      const f = Auto.fire; autoCancel(); if (f) f();
    }, Auto.remaining);
    autoPaint(true);
  }
}
document.addEventListener('visibilitychange', autoUpdate);
new MutationObserver(autoUpdate).observe($('#overlay'), {attributes: true, attributeFilter: ['class']});

// ---------- study round ----------
// queue[0] is the current question. Correct → retired (never returns this round).
// Wrong → re-inserted REQUEUE_GAP positions later.
let widget = null;
function startRound(ids){
  cs().study = {queue: shuffle(ids), total: ids.length, done: [], wrongOnce: [], attempts: 0, wrong: 0, current: null};
  persist();
}
function renderStudy(v){
  if (Sync.initialPending){ v.innerHTML = '<div class="panel empty" id="syncLoading">Loading your synced progress…</div>'; return; }
  if (!cs().study){
    const list = filtered();
    if (!list.length){ v.innerHTML = '<div class="panel empty">No cards match this filter. Pick "All cards" or star some questions.</div>'; return; }
    startRound(list.map(c => c.n));
  }
  const R = cs().study;
  if (!R.queue.length){ renderFinish(v); return; }
  const n = R.queue[0], c = byN(n);
  if (!c){ R.queue.shift(); persist(); render(); return; }
  const pct = 100 * R.done.length / R.total;
  v.innerHTML = '<div class="panel" id="study"><div class="qhead"><span class="done-count" id="doneCount">' + R.done.length + ' / ' + R.total + ' done</span>' +
    '<span class="row"><span class="muted" style="font-size:.88rem" id="mistakes">' + R.wrong + ' mistake' + (R.wrong === 1 ? '' : 's') + ' · ' + R.queue.length + ' left</span>' +
    '<label class="auto-toggle" title="Go to the next question automatically (' + AUTO_NEXT_MS.correct / 1000 + ' s after a right answer, ' + AUTO_NEXT_MS.wrong / 1000 + ' s after a wrong one)"><input type="checkbox" id="autoChk"' + (Auto.on ? ' checked' : '') + '>Auto-next</label>' +
    '<button class="btn small ghost" id="restartRound">Restart</button></span></div>' +
    '<div class="progress"><i id="progressBar" style="width:' + pct + '%"></i></div>' +
    '<div id="qbox" data-n="' + n + '"></div>' +
    '<div class="row right" style="margin-top:14px"><button class="btn primary next-btn" id="nextBtn" style="display:none" data-auto="off"><span class="nb-label">Next →</span><span class="auto-fill" aria-hidden="true"></span></button></div></div>' +
    '<div class="kbd hide-sm">' + (isFill(c) ? '<kbd>Enter</kbd> check / next' : '<kbd>1</kbd>–<kbd>' + optIdx(c).length + '</kbd> or <kbd>A</kbd>–<kbd>' + L[optIdx(c).length - 1] + '</kbd> to answer · <kbd>Enter</kbd> check / next') + '</div>';
  let advanced = false, pendingMs = 0;
  const advance = () => { if (advanced) return; advanced = true; autoCancel(); render(); window.scrollTo({top:0}); };
  widget = questionWidget($('#qbox'), c, {again: R.wrongOnce.includes(n)}, (correct, d) => {
    if (d.override){
      // typed answer marked right after being graded wrong: undo the re-queue and retire it
      const idx = R.queue.indexOf(n); if (idx >= 0) R.queue.splice(idx, 1);
      if (!R.done.includes(n)) R.done.push(n);
      R.wrong = Math.max(0, R.wrong - 1);
      if (R.lastMissFirstTime){ R.wrongOnce = R.wrongOnce.filter(x => x !== n); delete cs().missed[n]; }
      const st = cs().stats[n]; if (st){ st.w = Math.max(0, st.w - 1); st.r++; }
    } else {
      R.attempts++;
      const firstTry = !R.wrongOnce.includes(n);
      R.queue.shift();
      const st = cs().stats[n] || (cs().stats[n] = {r:0, w:0});
      if (correct){
        st.r++; R.done.push(n);
        if (firstTry) delete cs().missed[n];
      } else {
        st.w++; R.wrong++; cs().missed[n] = true;
        R.lastMissFirstTime = firstTry;
        if (firstTry) R.wrongOnce.push(n);
        R.queue.splice(Math.min(R.queue.length, REQUEUE_GAP), 0, n);
      }
    }
    window.__ethicsQuiz.last = {n: n, set: S.active, correct: !!(correct || d.override), override: !!d.override};
    touch(); updateCount();
    $('#doneCount').textContent = R.done.length + ' / ' + R.total + ' done';
    $('#progressBar').style.width = (100 * R.done.length / R.total) + '%';
    $('#mistakes').textContent = R.wrong + ' mistake' + (R.wrong === 1 ? '' : 's') + ' · ' + R.queue.length + ' left';
    const nb = $('#nextBtn'); nb.querySelector('.nb-label').textContent = R.queue.length ? 'Next →' : 'Finish →'; nb.style.display = ''; nb.focus({preventScroll:true});
    // auto-advance: short wait after right, longer after wrong (more time to read the green option), longest for a wrong typed answer
    const fbRow = !correct && !d.override ? $('#feedback') : null;
    pendingMs = (correct || d.override) ? AUTO_NEXT_MS.correct : (fbRow ? AUTO_NEXT_MS.typedWrong : AUTO_NEXT_MS.wrong);
    autoStart(pendingMs, advance);
    if (fbRow){
      const hold = (k, on) => { if (on) Auto.hold.add(k); else Auto.hold.delete(k); autoUpdate(); };
      fbRow.addEventListener('mouseenter', () => hold('hover', true));
      fbRow.addEventListener('mouseleave', () => hold('hover', false));
      fbRow.addEventListener('focusin', () => hold('focus', true));
      fbRow.addEventListener('focusout', () => hold('focus', false));
    }
  });
  $('#nextBtn').addEventListener('click', advance);
  $('#autoChk').addEventListener('change', e => {
    Auto.on = e.target.checked;
    try { localStorage.setItem(AUTO_KEY, Auto.on ? 'on' : 'off'); } catch(err){}
    const nb = $('#nextBtn');
    if (!Auto.on) autoCancel();
    else if (nb && nb.style.display !== 'none' && !advanced) autoStart(pendingMs || AUTO_NEXT_MS.correct, advance);
    toast('Auto-next ' + (Auto.on ? 'on' : 'off'));
  });
  $('#restartRound').addEventListener('click', () => { if (R.done.length === 0 || confirm('Restart this round? Progress in the current round will be cleared.')){ cs().study = null; touch(); render(); } });
}
function renderFinish(v){
  const R = cs().study;
  const firstTry = R.total - R.wrongOnce.length;
  v.innerHTML = '<div class="panel" id="finish"><div class="result-hero"><div class="big">🎉</div><h2 style="margin:6px 0" id="finishTitle">All ' + R.total + ' questions answered correctly!</h2>' +
    '<p class="muted" style="margin:0">Round complete.</p></div>' +
    '<div class="stat-grid"><div class="stat"><b>' + firstTry + ' / ' + R.total + '</b><span>right first try</span></div><div class="stat"><b>' + R.wrong + '</b><span>mistakes along the way</span></div><div class="stat"><b>' + R.attempts + '</b><span>answers given</span></div></div>' +

}

// ---------- CSV parsing ----------
// RFC-4180 style: quoted fields with "" escapes, delimiters / CR / LF inside quotes, BOM, CRLF / CR / LF line ends.
function parseCSV(text){
  text = String(text == null ? '' : text).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');   // CRLF / CR -> LF (also inside quoted fields)
  const first = (text.split(/\r\n|\n|\r/, 1)[0] || '');
  const cnt = ch => first.split(ch).length - 1;
  const delim = cnt('\t') > cnt(',') ? '\t' : (cnt(';') > cnt(',') ? ';' : ',');
  const rows = []; let row = [], f = '', q = false, i = 0;
  const n = text.length;
  while (i < n){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i + 1] === '"'){ f += '"'; i += 2; continue; } q = false; i++; continue; }
      f += ch; i++; continue;
    }
    if (ch === '"' && f.trim() === ''){ q = true; f = ''; i++; continue; }
    if (ch === delim){ row.push(f); f = ''; i++; continue; }
    if (ch === '\r' || ch === '\n'){ row.push(f); rows.push(row); row = []; f = ''; i += (ch === '\r' && text[i + 1] === '\n') ? 2 : 1; continue; }
    f += ch; i++;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  rows.unterminated = q;
  rows.delimiter = delim;
  return rows;
}
// difflib.SequenceMatcher-style ratio (Ratcliff/Obershelp), same threshold the build pipeline used.
function simRatio(a, b){
  if (!a.length && !b.length) return 1;
  function matches(a, b){
    if (!a.length || !b.length) return 0;
    let best = 0, bi = 0, bj = 0;
    const prev = new Array(b.length + 1).fill(0);
    for (let i = 1; i <= a.length; i++){
      let diag = 0;
      for (let j = 1; j <= b.length; j++){
        const tmp = prev[j];

    const s = local.sets[id];
    if (!s || s.builtin || f.sets[id] || f.deleted[id]) return;
    f.sets[id] = s; f.order.push(id); changed++;                                                                 // uploaded here, remote lacks it
  });
  f.order = f.order.filter(id => f.sets[id]);
  f.tab = prevTab;                                        // which tab is open stays per-device
  f.active = f.sets[prevActive] ? prevActive : BUILTIN_ID; // and so does the selected set
  f.updatedAt = ts;
  S = f; persist();
  if (changed){ Sync.note('merged ' + changed + ' set change(s); re-pushing'); setTimeout(() => touch(), 0); }
  if (f.active !== prevActive){ widget = null; render(); return; }
  // Don't yank the screen away while the user is looking at an answered question; Next will show the synced state.
  const nb = $('#nextBtn');
  if (S.tab === 'study' && !Sync.initialPending && nb && nb.style.display !== 'none'){ updateCount(); return; }
  render();
}
// Pull remote, then last-write-wins on the whole state: newer remote → adopt; newer local → push.
async function pull(depth){
  if (!Sync.active()) return;
  Sync.note('pull d=' + (depth || 0));
  depth = depth || 0;
  setStatus('syncing');
  try {
    const rows = await rpc('get_progress', {p_code: Sync.code}, {timeout: 8000});
    const row = rows && rows[0];
    Sync.retryDelay = 5000;
    if (!row){ if (S.updatedAt > 0) await push(depth + 1); else setStatus('synced'); return; }
    const remoteTs = parseTs(row.updated_at), localTs = S.updatedAt || 0;
    if (remoteTs > localTs) { adoptRemote(row.state, remoteTs); setStatus('synced'); }
    else if (localTs > remoteTs && depth < 3) await push(depth + 1);
    else setStatus('synced');
  } catch(e){ onSyncError(e); }
}
async function push(depth, opts){
  if (!Sync.active()) return;
  clearTimeout(Sync.timer); Sync.timer = null;
  if (Sync.inflight){ Sync.again = true; return Sync.inflight; }
  depth = depth || 0;
  if (!S.updatedAt){ S.updatedAt = Date.now(); persist(); }
  const sentTs = S.updatedAt;
  Sync.note('push ' + sentTs + (opts && opts.keepalive ? ' keepalive' : ''));
  setStatus('syncing');
  Sync.inflight = (async () => {
    try {
      const rows = await rpc('save_progress', {p_code: Sync.code, p_state: serialize(), p_updated_at: new Date(sentTs).toISOString()}, opts);
      const row = rows && rows[0];
      Sync.retryDelay = 5000;
      if (row && row.applied === false){ Sync.inflight = null; if (depth < 3) await pull(depth + 1); return; }
      if (row && row.updated_at){ const t = parseTs(row.updated_at); if (S.updatedAt === sentTs && t !== sentTs){ S.updatedAt = t; persist(); } }
      setStatus(S.updatedAt === sentTs || (row && parseTs(row.updated_at) === S.updatedAt) ? 'synced' : 'syncing');
    } catch(e){ onSyncError(e); }
    finally { Sync.inflight = null; }
  })();
  await Sync.inflight;
  if (Sync.again){ Sync.again = false; return push(); }
  if (Sync.status === 'syncing' && !Sync.timer) Sync.schedule();   // changed while uploading
}
function flushNow(){ if (Sync.active() && Sync.timer){ clearTimeout(Sync.timer); Sync.timer = null; push(0, {keepalive: true}); } }
async function initialSync(){
  if (!Sync.active()) return;
  Sync.initialPending = true; render();
  const guard = setTimeout(() => { if (Sync.initialPending){ Sync.initialPending = false; render(); } }, 9000);
  await pull();
  clearTimeout(guard);
  if (Sync.initialPending){ Sync.initialPending = false; render(); }
}
function summary(st){
  const m = migrate(st), ids = m.order.filter(id => m.sets[id]);
  let done = 0, total = 0, started = 0;
  ids.forEach(id => { const d = m.sets[id].study; if (d){ started++; done += d.done.length; total += d.total; } });
  return ids.length + ' set' + (ids.length === 1 ? '' : 's') + ' · ' + (started ? done + ' / ' + total + ' done' : 'no round started');
}
// Connect (or change) the sync code. If both this device and the cloud already have progress, let the user choose.
async function connectCode(code){
  clearTimeout(Sync.timer); Sync.timer = null; clearTimeout(Sync.retryTimer);
  Sync.code = code; localStorage.setItem(SYNC_CODE_KEY, code); Sync.retryDelay = 5000;
  setStatus('syncing');
  let row;
  try { const rows = await rpc('get_progress', {p_code: code}); row = rows && rows[0]; }
  catch(e){ onSyncError(e); return {done:true}; }
  if (!row){ await push(); return {done:true}; }
  if (!(S.updatedAt > 0)){ adoptRemote(row.state, parseTs(row.updated_at)); setStatus('synced'); return {done:true}; }
  return {conflict: row};
}
function openSync(){
  const m = $('#modal');
  const draw = (conflictRow) => {
    m.innerHTML = '<h3>Sync across devices</h3>' +
      '<p class="muted" style="margin:0 0 8px;font-size:.92rem">Enter the same sync code on each device. No account needed; your sets, progress, stars, edited answers and stats are synced.</p>' +
      '<div class="sync-note"><b>Your sync code works like a password.</b> Anyone who knows it can see and change your progress, so pick something hard to guess (e.g. <code>thomas-ethics-7k3p</code>).</div>' +
      '<label style="font-size:.9rem;font-weight:600" for="syncCodeIn">Sync code</label>' +
      '<input class="fill-input" id="syncCodeIn" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. thomas-ethics-7k3p" value="' + esc(Sync.code) + '">' +
      '<div class="muted" style="font-size:.8rem;margin-top:4px">3–64 characters: lowercase letters, digits, - or _</div>' +
      (conflictRow ? '<div class="choice-box" id="syncConflict"><b>Both this device and the cloud already have progress for this code.</b>' +
        '<div style="font-size:.9rem">Cloud: ' + esc(summary(conflictRow.state)) + ' · saved ' + esc(new Date(conflictRow.updated_at).toLocaleString()) + '<br>This device: ' + esc(summary(serialize())) + ' · saved ' + esc(new Date(S.updatedAt).toLocaleString()) + '</div>' +
        '<div class="row"><button class="btn primary" id="useCloud">Use cloud progress</button><button class="btn" id="useLocal">Keep this device\'s (overwrite cloud)</button></div></div>' : '') +
      '<div class="sync-status muted" id="syncModalStatus">' + esc(statusLine()) + '</div>' +
      '<div class="row right" style="margin-top:14px">' +
        (Sync.code ? '<button class="btn ghost" id="syncOff">Turn off sync here</button><button class="btn" id="syncNow">Sync now</button>' : '') +
        '<button class="btn" id="syncClose">Close</button><button class="btn primary" id="syncSave">' + (Sync.code ? 'Save code' : 'Start syncing') + '</button></div>';
    const close = () => $('#overlay').classList.remove('show');
    $('#syncClose').onclick = close;
    const off = $('#syncOff'); if (off) off.onclick = () => { clearTimeout(Sync.timer); clearTimeout(Sync.retryTimer); Sync.code = ''; localStorage.removeItem(SYNC_CODE_KEY); setStatus('off'); toast('Sync turned off on this device (progress kept locally)'); draw(); };
    const now = $('#syncNow'); if (now) now.onclick = () => pull();
    $('#syncSave').onclick = async () => {
      const code = $('#syncCodeIn').value.trim().toLowerCase();
      if (!CODE_RE.test(code)){ toast('Use 3–64 characters: a–z, 0–9, - or _'); $('#syncCodeIn').focus(); return; }
      if (code === Sync.code && !conflictRow){ pull(); close(); return; }
      const res = await connectCode(code);
      if (res.conflict) draw(res.conflict); else { close(); toast(Sync.status === 'synced' ? 'Sync on: ' + code : 'Sync code saved'); }
    };
    $('#syncCodeIn').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); $('#syncSave').click(); } });
    const uc = $('#useCloud'); if (uc) uc.onclick = () => { adoptRemote(conflictRow.state, parseTs(conflictRow.updated_at)); setStatus('synced'); close(); toast('Loaded cloud progress'); };
    const ul = $('#useLocal'); if (ul) ul.onclick = async () => { S.updatedAt = Math.max(Date.now(), parseTs(conflictRow.updated_at) + 1); persist(); close(); await push(); toast('Uploaded this device\'s progress'); };
  };
  draw();
  $('#overlay').classList.add('show');
}
$('#syncBtn').addEventListener('click', openSync);
document.addEventListener('visibilitychange', () => { Sync.note('visibility ' + document.visibilityState); if (document.visibilityState === 'hidden') flushNow(); else if (Sync.active() && !Sync.timer && !Sync.inflight) pull(); });
window.addEventListener('pagehide', flushNow);
window.addEventListener('online', () => { if (Sync.active()) pull(); });
window.addEventListener('offline', () => { if (Sync.active()) setStatus('offline'); });

// ---------- export ----------
function csvCell(s){ s = String(s == null ? '' : s); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function buildCSV(){
  const P = cs(), all = cards();
  const nChoices = P.builtin ? 4 : Math.max(2, ...all.map(c => c.c.length));
  const rows = [['Question'].concat(L.slice(0, nChoices), ['Answer','AnswerText','Edited'])];
  all.forEach(c => {
    const at = P.builtin && !isEdited(c) ? c.at : answerText(c).replace(/^[A-F]\. /gm, '');
    rows.push([c.q].concat(L.slice(0, nChoices).map((_, i) => c.c[i] || ''), [isFill(c) ? '' : ans(c), at, isEdited(c) ? 'yes' : 'no']));
  });
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}
window.__ethicsQuiz = {AUTO_NEXT_MS, auto: () => ({on: Auto.on, active: Auto.active, running: !!Auto.timer, remaining: Auto.remaining, token: Auto.token}), buildCSV, deck: DECK, state: () => S, serialize, migrate, parseCSV, importCSV, matchAnswer, simRatio, switchSet, addSet, last: null};
$('#exportBtn').addEventListener('click', () => {
  const P = cs();
  const blob = new Blob(['\ufeff' + buildCSV()], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = P.builtin ? 'ethics_quiz_export.csv' : (P.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'set') + '_export.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('CSV exported (' + Object.keys(P.edits).length + ' edited answers)');
});
$('#resetBtn').addEventListener('click', () => {
  const P = cs();
  if (!confirm('Reset progress for “' + P.name + '” (stars, missed, stats, current round)? Your edited answers and other sets are kept.')) return;
  Object.assign(P, blankProgress(), {edits: P.edits}); widget = null; touch(); render(); toast('Progress reset');
});

// ---------- events ----------
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#filterSel').addEventListener('change', e => {
  const P = cs(), prev = P.filter; P.filter = e.target.value;
  if (S.tab === 'study' && P.study && P.study.done.length && !confirm('Start a new round with this card filter? Current round progress will be cleared.')){ P.filter = prev; e.target.value = prev; return; }
  P.study = null; touch(); render();
});
document.addEventListener('keydown', e => {
  if ($('#overlay').classList.contains('show')){ if (e.key === 'Escape') $('#overlay').classList.remove('show'); return; }
  if (e.key === 'Escape' && $('#sidebar').classList.contains('open')){ closeDrawer(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.target.closest && e.target.closest('#sidebar')) return;
  if (e.metaKey || e.ctrlKey || e.altKey || S.tab !== 'study') return;
  if (widget && widget.key(e.key)){ e.preventDefault(); return; }
  const nb = $('#nextBtn');
  if ((e.key === 'Enter' || e.key === 'ArrowRight') && nb && nb.style.display !== 'none' && document.activeElement !== nb){ e.preventDefault(); nb.click(); }
});
mqMobile.addEventListener('change', ev => { if (!ev.matches) closeDrawer(); else syncBrandAria(); });
setStatus(Sync.active() ? 'syncing' : 'off');
render();
initialSync();
})();
</script>
